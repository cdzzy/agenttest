[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdzzy-agenttest"
version = "0.4.0"
description = "The testing framework for AI agents — think pytest, but for agents."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "cdzzy", email = "cdzzy@users.noreply.github.com"},
]
keywords = ["ai", "agent", "testing", "llm", "langchain", "langgraph", "autogen", "crewai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio",
]
langchain = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
]
openai = [
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/cdzzy/agenttest"
Repository = "https://github.com/cdzzy/agenttest"
Issues = "https://github.com/cdzzy/agenttest/issues"

[project.scripts]
agenttest = "agenttest.cli:main"

[project.entry-points.pytest11]
agenttest = "agenttest.pytest_plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["agenttest*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
